services:
  - type: web
    name: textbook-backend
    runtime: docker
    plan: pro
    dockerfilePath: ./textbook-backend/Dockerfile
    dockerContext: ./textbook-backend
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
